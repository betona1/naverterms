<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>워커 설치</title>
<style>body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px}
.btn{display:inline-block;padding:20px 40px;font-size:20px;background:#16a34a;color:#fff;text-decoration:none;border-radius:8px}
.step{margin:20px 0;padding:15px;background:#f3f4f6;border-radius:8px}
h1{color:#1e40af}</style></head><body>
<h1>🚀 ComfyUI 워커 설치</h1>
<div class="step">
  <h3>① 다운로드 (한 번 클릭)</h3>
  <a href="/install_all.ps1" download="install_all.ps1" class="btn">⬇ install_all.ps1 다운로드</a>
</div>
<div class="step">
  <h3>② 실행</h3>
  다운로드 폴더 → <b>install_all.ps1 파일 우클릭</b> → <b>"PowerShell로 실행"</b><br>
  UAC 창 → <b>예</b><br>
  자동 진행 (15~25분)
</div>
<div class="step">
  <h3>"PowerShell로 실행" 메뉴 없으면</h3>
  파일 <b>Shift + 우클릭</b> → 메뉴에 나타남
</div>
</body></html>
